name: Modular regression tests
on:
  push:
    branches: [refactor/modular-architecture]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          for f in src/*.js auth.js globe.js; do
            node --input-type=module --check < "$f" || exit 1
          done
      - name: Browser regression
        run: python3 tests/run_browser.py
      - name: Reminder regression
        if: always()
        run: python3 tests/test_remind.py
      - name: Social service regression (mock Firebase)
        if: always()
        run: node tests/social.mjs
      - name: Live reading profile publication regression
        if: always()
        run: node tests/reading-sync.mjs
  firestore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install test dependencies
        run: npm install --no-save --package-lock=false firebase@11 @firebase/rules-unit-testing@4 firebase-tools@14
      - name: Firestore rules integration
        run: npx firebase emulators:exec --only firestore --project demo-v-slove "node tests/firestore-emulator.mjs"
