name: Напоминания в 22:00

on:
  schedule:
    - cron: "7 * * * *"   # каждый час; скрипт сам выбирает тех, у кого сейчас 22:00–23:59 и кто не читал
  workflow_dispatch:
    inputs:
      force:
        description: "Тест: прислать проверочное уведомление всем, у кого включены напоминания"
        type: boolean
        default: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "firebase-admin==6.5.0"
      - run: python .github/scripts/remind.py
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FORCE: ${{ inputs.force }}
